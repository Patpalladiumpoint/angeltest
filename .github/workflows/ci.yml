name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: palladium_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/palladium_test
      MIGRATIONS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/palladium_test
      APP_DATABASE_URL: postgres://palladium_app:palladium_app_test@localhost:5432/palladium_test
      DATABASE_URL: postgres://palladium_app:palladium_app_test@localhost:5432/palladium_test
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
